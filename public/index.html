var activeTab = "ALLE";

function init() {
  var tabsContainer = document.getElementById("tabs");
  var keys = ["ALLE"].concat(Object.keys(data));
  
  tabsContainer.innerHTML = "";
  for (var i = 0; i < keys.length; i++) {
    (function(k) {
      var btn = document.createElement("button");
      btn.className = "tab" + (k === activeTab ? " active" : "");
      btn.textContent = k === "ALLE" ? "🔍 Alle (Gesamtsuche)" : k;
      btn.onclick = function() {
        activeTab = k;
        var allTabs = tabsContainer.getElementsByTagName("button");
        for (var j = 0; j < allTabs.length; j++) {
          allTabs[j].className = "tab";
        }
        btn.className = "tab active";
        render();
      };
      tabsContainer.appendChild(btn);
    })(keys[i]);
  }
  
  document.getElementById("search").oninput = render;
  render();
}

function getBadge(v) {
  if (v === "PKV") return '<span class="badge pkv">PKV</span>';
  if (v === "GKV") return '<span class="badge gkv">GKV</span>';
  if (v === "Unklar") return '<span class="badge unklar">Unklar</span>';
  return v || "";
}

function render() {
  var q = document.getElementById("search").value.toLowerCase().trim();
  var thead = document.getElementById("thead");
  var tbody = document.getElementById("tbody");
  var cols = [];
  var rows = [];
  
  if (activeTab === "ALLE") {
    cols = ["Kategorie", "Nachname / Einrichtung", "Vorname / Details", "Straße", "PLZ", "Ort", "Telefonnummer", "Versicherung", "Notizen"];
    
    for (var cat in data) {
      var sheet = data[cat];
      for (var r = 0; r < sheet.rows.length; r++) {
        var rowData = sheet.rows[r];
        var fullText = (cat + " " + rowData.join(" ")).toLowerCase();
        
        if (!q || fullText.indexOf(q) !== -1) {
          if (sheet.cols.indexOf("Patienten-ID") !== -1) {
            rows.push([
              cat, rowData[1], (rowData[2] + " " + (rowData[0] ? "(" + rowData[0] + ")" : "")).trim(),
              rowData[4], rowData[5], rowData[6], rowData[7], rowData[8], (rowData[9] + " " + rowData[10]).trim()
            ]);
          } else {
            rows.push([
              cat, rowData[0], "Einrichtung", rowData[1], rowData[2], rowData[3], rowData[4],
              "PKV: " + rowData[5] + " / GKV: " + rowData[6], rowData[8]
            ]);
          }
        }
      }
    }
  } else {
    var sheet = data[activeTab];
    cols = sheet.cols;
    for (var r = 0; r < sheet.rows.length; r++) {
      var rowData = sheet.rows[r];
      var fullText = rowData.join(" ").toLowerCase();
      if (!q || fullText.indexOf(q) !== -1) {
        rows.push(rowData);
      }
    }
  }
  
  // Render Headings
  var headHtml = "";
  for (var c = 0; c < cols.length; c++) {
    headHtml += "<th>" + cols[c] + "</th>";
  }
  thead.innerHTML = headHtml;
  
  // Render Rows
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="' + cols.length + '" style="text-align:center; padding:20px; color:#94a3b8;">Keine Treffer gefunden</td></tr>';
  } else {
    var bodyHtml = "";
    for (var i = 0; i < rows.length; i++) {
      bodyHtml += "<tr>";
      for (var j = 0; j < rows[i].length; j++) {
        bodyHtml += "<td>" + getBadge(rows[i][j]) + "</td>";
      }
      bodyHtml += "</tr>";
    }
    tbody.innerHTML = bodyHtml;
  }
  
  document.getElementById("count").textContent = rows.length + " Einträge gefunden";
}
