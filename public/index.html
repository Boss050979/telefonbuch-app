<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telefonbuch Düren & Köln (Live Web-App)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1e293b; background: #f1f5f9; margin: 0; padding: 12px; }
  .card { max-width: 1200px; margin: 0 auto; background: #ffffff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h1 { font-size: 1.3rem; color: #1e3a8a; margin: 0 0 6px 0; }
  .sub { color: #64748b; font-size: 0.85rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab { padding: 6px 12px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 20px; font-weight: 600; font-size: 0.8rem; color: #475569; cursor: pointer; }
  .tab.active { background: #2563eb; color: #ffffff; border-color: #2563eb; }
  
  .controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .search-container { flex: 1; background: #fef08a; padding: 10px; border-radius: 8px; border: 2px solid #eab308; min-width: 250px; }
  .search-container label { font-weight: 700; color: #854d0e; font-size: 0.85rem; display: block; margin-bottom: 4px; }
  .search-container input { width: 100%; padding: 8px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; background: #fff; }
  
  .action-box { background: #e0f2fe; padding: 10px; border-radius: 8px; border: 2px solid #0284c7; display: flex; align-items: center; }
  .btn-add { background: #0284c7; color: white; border: none; padding: 10px 16px; font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .btn-add:hover { background: #0369a1; }
  
  .info { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; font-weight: 600; }
  
  .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; max-height: 60vh; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left; white-space: nowrap; }
  th { background: #1e3a8a; color: #ffffff; padding: 8px 10px; font-size: 0.75rem; text-transform: uppercase; position: sticky; top: 0; z-index: 10; }
  td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }
  tr:nth-child(even) { background: #f8fafc; }
  
  .badge { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; }
  .pkv { background: #fef3c7; color: #92400e; }
  .gkv { background: #dcfce7; color: #166534; }
  .unklar { background: #e2e8f0; color: #475569; }
  
  a.web-link { color: #2563eb; text-decoration: none; font-weight: 600; }
  a.web-link:hover { text-decoration: underline; }

  .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
  .modal-content { background: white; padding: 20px; border-radius: 10px; width: 400px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
  .modal-content h2 { margin-top: 0; font-size: 1.1rem; color: #1e3a8a; }
  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; }
  .form-group input { width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.9rem; }
  .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
  .btn-save { background: #16a34a; color: white; border: none; padding: 8px 14px; border-radius: 4px; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: #64748b; color: white; border: none; padding: 8px 14px; border-radius: 4px; font-weight: 600; cursor: pointer; }
  .btn-del { background: #dc2626; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; margin-right: 4px; }
  .btn-edit { background: #2563eb; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
</style>
</head>
<body>

<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1>📞 Telefonbuch Düren & Köln (Live Web-App)</h1>
    <span style="font-size:0.75rem; background:#dcfce7; color:#166534; padding:4px 8px; border-radius:12px; font-weight:700;">🟢 Live Server verbunden</span>
  </div>
  <div class="sub">
    <span>Echtzeit-Synchronisation über SQLite-Datenbank</span>
    <button onclick="loadData()" style="background:none; border:1px solid #cbd5e1; border-radius:4px; padding:4px 8px; cursor:pointer; font-size:0.75rem;">🔄 Neu laden</button>
  </div>
  
  <div class="tabs" id="tabs"></div>
  
  <div class="controls">
    <div class="search-container">
      <label for="search">🔍 Live-Suchfeld:</label>
      <input type="search" id="search" placeholder="Name, Straße, PLZ, Telefon eingeben..." autocomplete="off">
    </div>
    <div class="action-box" id="addActionBox" style="display:none;">
      <button class="btn-add" onclick="openAddModal()">➕ Neuen Eintrag hinzufügen</button>
    </div>
  </div>
  
  <div class="info" id="count">0 Einträge</div>
  
  <div class="table-responsive">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="modal" id="entryModal">
  <div class="modal-content">
    <h2 id="modalTitle">Eintrag</h2>
    <div id="modalFormFields"></div>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal()">Abbrechen</button>
      <button class="btn-save" onclick="saveEntryData()">Speichern</button>
    </div>
  </div>
</div>

<script>
let allData = [];
let editId = null;
const categoryCols = {
  "Düren – Patienten": ["Patienten-ID", "Nachname", "Vorname", "Geburtsdatum", "Straße", "PLZ", "Ort", "Telefonnummer", "Versicherung", "Zugewiesene Einrichtung", "Notizen"],
  "Düren – Heime": ["Einrichtung", "Straße", "PLZ", "Ort", "Telefonnummer", "PKV", "GKV", "Website", "Notizen"],
  "Düren – Krankenhäuser": ["Einrichtung", "Straße", "PLZ", "Ort", "Telefonnummer", "PKV", "GKV", "Website", "Notizen"],
  "Köln – Patienten": ["Patienten-ID", "Nachname", "Vorname", "Geburtsdatum", "Straße", "PLZ", "Ort", "Telefonnummer", "Versicherung", "Zugewiesene Einrichtung", "Notizen"],
  "Köln – Heime": ["Einrichtung", "Straße", "PLZ", "Ort", "Telefonnummer", "PKV", "GKV", "Website", "Notizen"],
  "Köln – Krankenhäuser": ["Einrichtung", "Straße", "PLZ", "Ort", "Telefonnummer", "PKV", "GKV", "Website", "Notizen"]
};

var activeTab = "ALLE";

async function loadData() {
  try {
    const res = await fetch('/api/data');
    allData = await res.json();
    initTabs();
    render();
  } catch (e) {
    console.error("Fehler beim Laden", e);
  }
}

function initTabs() {
  var tabsContainer = document.getElementById("tabs");
  var keys = ["ALLE"].concat(Object.keys(categoryCols));
  tabsContainer.innerHTML = "";
  keys.forEach(k => {
    var btn = document.createElement("button");
    btn.className = "tab" + (k === activeTab ? " active" : "");
    btn.textContent = k === "ALLE" ? "🔍 Alle (Gesamtsuche)" : k;
    btn.onclick = () => { activeTab = k; initTabs(); render(); };
    tabsContainer.appendChild(btn);
  });
}

function formatCell(val) {
  if (!val) return "";
  let strVal = String(val).trim();
  
  if (strVal === "PKV") return '<span class="badge pkv">PKV</span>';
  if (strVal === "GKV") return '<span class="badge gkv">GKV</span>';
  if (strVal === "Unklar") return '<span class="badge unklar">Unklar</span>';
  
  // Verbesserte URL-Erkennung per Regex
  let lower = strVal.toLowerCase();
  if (lower.startsWith("http://") || lower.startsWith("https://") || lower.startsWith("www.")) {
    let url = lower.startsWith("www.") ? "https://" + strVal : strVal;
    return `<a href="${url}" target="_blank" class="web-link">🔗 ${strVal}</a>`;
  }
  
  return strVal;
}

function render() {
  var q = document.getElementById("search").value.toLowerCase().trim();
  var thead = document.getElementById("thead");
  var tbody = document.getElementById("tbody");
  var addActionBox = document.getElementById("addActionBox");
  
  addActionBox.style.display = (activeTab === "ALLE") ? "none" : "flex";
  
  var cols = [];
  var displayRows = [];
  
  if (activeTab === "ALLE") {
    cols = ["Kategorie", "Nachname / Einrichtung", "Vorname / Details", "Straße", "PLZ", "Ort", "Telefonnummer", "Versicherung", "Notizen"];
    allData.forEach(item => {
      var cat = item.category;
      var rowData = [item.col1, item.col2, item.col3, item.col4, item.col5, item.col6, item.col7, item.col8, item.col9, item.col10, item.col11];
      var fullText = (cat + " " + rowData.join(" ")).toLowerCase();
      if (!q || fullText.indexOf(q) !== -1) {
        if (cat.indexOf("Patienten") !== -1) {
          displayRows.push({ id: item.id, cols: [cat, rowData[1], (rowData[2] + " " + (rowData[0] ? "(" + rowData[0] + ")" : "")).trim(), rowData[4], rowData[5], rowData[6], rowData[7], rowData[8], (rowData[9] + " " + rowData[10]).trim()] });
        } else {
          displayRows.push({ id: item.id, cols: [cat, rowData[0], "Einrichtung", rowData[1], rowData[2], rowData[3], rowData[4], "PKV: " + rowData[5] + " / GKV: " + rowData[6], rowData[8]] });
        }
      }
    });
  } else {
    cols = categoryCols[activeTab];
    allData.filter(item => item.category === activeTab).forEach(item => {
      var rowData = [item.col1, item.col2, item.col3, item.col4, item.col5, item.col6, item.col7, item.col8, item.col9, item.col10, item.col11];
      var fullText = rowData.join(" ").toLowerCase();
      if (!q || fullText.indexOf(q) !== -1) {
        displayRows.push({ id: item.id, raw: rowData, cols: rowData.slice(0, cols.length) });
      }
    });
  }
  
  let headerCols = (activeTab === "ALLE") ? cols : cols.concat(["Aktion"]);
  thead.innerHTML = headerCols.map(c => `<th>${c}</th>`).join("");
  
  if (displayRows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${headerCols.length}" style="text-align:center; padding:20px; color:#94a3b8;">Keine Treffer gefunden</td></tr>`;
  } else {
    if (activeTab === "ALLE") {
      tbody.innerHTML = displayRows.map(row => `<tr>${row.cols.map(v => `<td>${formatCell(v)}</td>`).join("")}</tr>`).join("");
    } else {
      tbody.innerHTML = displayRows.map(row => {
        let cellsHtml = row.cols.map(v => `<td>${formatCell(v)}</td>`).join("");
        return `<tr>${cellsHtml}<td><button class="btn-edit" onclick='openEditModal(${row.id}, ${JSON.stringify(row.raw)})'>Bearbeiten</button> <button class="btn-del" onclick="deleteEntry(${row.id})">Löschen</button></td></tr>`;
      }).join("");
    }
  }
  document.getElementById("count").textContent = displayRows.length + " Einträge gefunden";
}

function openAddModal() {
  if (activeTab === "ALLE") return;
  editId = null;
  document.getElementById("modalTitle").textContent = "Neuen Eintrag hinzufügen";
  document.getElementById("modalFormFields").innerHTML = categoryCols[activeTab].map((col, i) => `<div class="form-group"><label>${col}</label><input type="text" id="field_${i}"></div>`).join("");
  document.getElementById("entryModal").style.display = "flex";
}

function openEditModal(id, rawData) {
  editId = id;
  document.getElementById("modalTitle").textContent = "Eintrag bearbeiten";
  document.getElementById("modalFormFields").innerHTML = categoryCols[activeTab].map((col, i) => `<div class="form-group"><label>${col}</label><input type="text" id="field_${i}" value="${rawData[i] || ''}"></div>`).join("");
  document.getElementById("entryModal").style.display = "flex";
}

function closeModal() { document.getElementById("entryModal").style.display = "none"; }

async function saveEntryData() {
  var values = categoryCols[activeTab].map((_, i) => document.getElementById(`field_${i}`).value);
  
  if (editId === null) {
    const res = await fetch('/api/entries', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ category: activeTab, cols: values }) });
    if (res.ok) { closeModal(); loadData(); }
  } else {
    const res = await fetch(`/api/entries/${editId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ category: activeTab, cols: values }) });
    if (res.ok) { closeModal(); loadData(); }
  }
}

async function deleteEntry(id) {
  if (!confirm("Eintrag wirklich löschen?")) rel = confirm("Eintrag wirklich löschen?"); if (!rel) return;
  const res = await fetch(`/api/entries/${id}`, { method: 'DELETE' });
  if (res.ok) loadData();
}

document.getElementById("search").oninput = render;
window.onload = loadData;
</script>
</body>
</html>
